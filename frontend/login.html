  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavaJatoPro - Login</title>
  
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <h1>LavaJato<span>Pro</span></h1>
         
        
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuário ou E-mail</label>
                
                <input type="text" id="usuario" name="username" 
                 placeholder="Digite seu usuário">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                
                <input type="password" id="senha" name="password"  placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
            
            <div class="div">
                <a href="#" id="linkEsqueciSenha"class="link-esqueci-senha">Esqueceu a senha?</a>
            </div>
        
        </form>
    </div>

   <script src='static/login.js'></script>
</body>
</html>
