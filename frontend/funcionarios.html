<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavaJatoPro - Funcionários</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <nav class="sidebar-menu">
        <div class="brand">LavaJatoPro</div>
        <ul>
            
            <li><a href="/dashboard" class="menu-item ">📊 Dashboard</a></li>
            <li><a href="/clientes" class="menu-item ">👥 Clientes</a></li>
            <li><a href="/veiculos" class="menu-item ">🚗 Veículos</a></li>
            <li><a href="/funcionarios" class="menu-item active">👨‍🍳 Funcionários</a></li>
            <li><a href="/ordens-servico" class="menu-item ">📝 Ordens de Serviço</a></li>
            <li><a href="/usuarios" class="menu-item ">🔒 Usuários/Config</a></li>
            <li><a href="/caixa" class="menu-item ">📦 Caixa</a></li>
            <li><a href="/auth" class="menu-item ">🚪 Sair / Login</a></li>
          </ul>
       
    </nav>

    <main class="main-content">
        <header class="content-header">
            <h2>Gerenciamento de Funcionários</h2>
             <button class="btn btn-primary" onclick="abrirModal()">+ Novo Funcionário</button>
          
        </header> 

        <section class="data-container">
            <table class="tabela-padrao">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Endereço</th>
                        <th>Telefone</th>
                        <th>Salário</th>
                        <th>Email</th>
                        <th>Senha</th>
                    </tr>
                </thead>
                <tbody id="tabela-funcionarios"></tbody>
            </table>
        </section>
    </main>

    <div id="modal-funcionario" class="modal">
        <div class="modal-conteudo">
           <h3>Cadastrar Novo Funcionario</h3>
            <form id="form-funcionario">
    <div>
        <input type="text" id="nome" placeholder="Nome Completo" required>
    </div>

    <div>
        <input type="text" id="endereco" placeholder="Endereço" required>
    </div>

    <div>
        <input type="text" id="telefone" placeholder="Telefone" required>
    </div>

    <div>
        <input type="number" id="salario" placeholder="Salário" step="0.01" required>
    </div>

    <div>
        <input type="email" id="email" placeholder="E-mail" required>
    </div>

    <div>
        <input type="password" id="senha" placeholder="Senha" required>
    </div>

    <div class="modal-acoes">
        <button type="button" class="btn btn-cancelar" onclick="fecharModal()">
            Cancelar
        </button>
        <button type="submit" class="btn btn-salvar">Salvar
        </button>
    </div>
</form>
        </div>
    </div>

   <script src="static/funcionarios.js"></script>
</body>
</html>
